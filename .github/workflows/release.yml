name: Build & Release AstroSquad Station

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            build_cmd: cd .app && npm install && npm run dist:win
            artifact_pattern: .app/release/*.exe
          - os: macos-latest
            arch: universal
            build_cmd: cd .app && npm install && npm run dist:mac
            artifact_pattern: .app/release/*.dmg

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile & Package Application
        run: ${{ matrix.build_cmd }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astrosquad-${{ matrix.os }}
          path: ${{ matrix.artifact_pattern }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: astrosquad-windows-latest
          path: release-artifacts
          merge-multiple: true

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: astrosquad-macos-latest
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
